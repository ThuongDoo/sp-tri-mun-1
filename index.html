<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="./client.js"></script>
    <script defer src="./data.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap");
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .heading-font {
        font-family: "Playfair Display", sans-serif;
      }
      .hero-bg {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      }
      .card-hover {
        transition: all 0.3s;
      }
      .card-hover:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      }
      .section-padding {
        padding: 3.5rem 1rem;
      }
      @media (min-width: 768px) {
        .section-padding {
          padding: 5rem 1rem;
        }
      }
      .sticky-cta {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
      }
      .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      @keyframes slideUp {
        from { transform: translateY(60px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }
      .popup-slide-up { animation: slideUp 0.35s ease; }
    </style>
  </head>
  <!-- // TODO: Thay tên thương hiệu, số điện thoại, link Zalo/Mess, ảnh thật của bạn
  vào data.js -->

  <body class="bg-zinc-50 text-zinc-800 pb-24 md:pb-0" x-data="clientApp()">
    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
      <div
        class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <template x-if="logo && (logo.startsWith('http') || logo.startsWith('/'))">
            <img :src="logo" class="w-9 h-9 rounded-xl object-cover" />
          </template>
          <template x-if="!logo || (!logo.startsWith('http') && !logo.startsWith('/'))">
            <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-bold text-2xl" x-text="logo || '🌿'"></div>
          </template>
          <h1
            class="text-2xl font-bold text-emerald-700 heading-font"
            x-text="brand"
          ></h1>
        </div>
        <nav class="hidden md:flex gap-6 text-sm font-medium">
          <template x-for="link in nav.links" :key="link.href">
            <a :href="link.href" class="hover:text-emerald-600" x-text="link.label"></a>
          </template>
        </nav>
        <div class="flex items-center gap-3">
          <a
            x-bind:href="zalo"
            target="_blank"
            class="text-emerald-600 hover:text-emerald-700"
            ><i class="fab fa-whatsapp text-xl"></i
          ></a>
          <a
            x-bind:href="messenger"
            target="_blank"
            class="text-emerald-600 hover:text-emerald-700"
            ><i class="fab fa-facebook-messenger text-xl"></i
          ></a>
          <button
            onclick="scrollToForm()"
            class="bg-emerald-600 text-white px-5 py-2 rounded-full font-medium text-sm hover:bg-emerald-700 transition"
            x-text="nav.cta"
          ></button>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero-bg text-white">
      <div
        class="max-w-7xl mx-auto grid md:grid-cols-2 gap-8 items-center px-4 pt-12 pb-16"
      >
        <!-- Left -->
        <div class="space-y-6">
          <div
            class="inline-flex items-center gap-2 bg-white/20 backdrop-blur px-4 py-1.5 rounded-full text-sm"
          >
            <span
              class="w-2 h-2 bg-green-400 rounded-full animate-pulse"
            ></span>
            <span x-text="hero.badge"></span>
          </div>
          <h1
            class="heading-font text-4xl md:text-5xl lg:text-6xl leading-tight font-bold"
          >
            <span x-text="hero.headline1"></span><br />
            <span class="text-emerald-200" x-text="hero.headline2"></span>
          </h1>
          <p class="text-lg md:text-xl text-emerald-100 max-w-md">
            <span x-text="hero.subtext"></span><br />
            <strong x-text="hero.subCta"></strong>
          </p>
          <div class="flex flex-col sm:flex-row gap-3">
            <button
              onclick="scrollToForm()"
              class="bg-white text-emerald-700 px-8 py-4 rounded-2xl font-semibold text-lg shadow-lg hover:scale-105 transition w-full sm:w-auto text-center"
              x-text="hero.ctaBtn"
            ></button>
            <a
              x-bind:href="'tel:' + phone.replace(/\s/g,'')"
              class="bg-white/20 hover:bg-white/30 border-2 border-white px-6 py-4 rounded-2xl flex items-center justify-center gap-2 font-semibold text-lg shadow-lg hover:scale-105 transition w-full sm:w-auto"
            >
              <span class="relative flex h-5 w-5 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-300 opacity-75"></span>
                <i class="fas fa-phone relative text-base"></i>
              </span>
              <span class="flex flex-col items-start leading-tight">
                <span class="text-sm font-medium opacity-90">Gọi ngay</span>
                <span class="font-bold tracking-wide text-base" x-text="phone"></span>
              </span>
            </a>
          </div>
          <div class="flex items-center gap-6 text-sm">
            <div class="flex -space-x-3">
              <img
                src="https://picsum.photos/id/64/32/32"
                class="w-7 h-7 rounded-full ring-2 ring-white"
              />
              <img
                src="https://picsum.photos/id/201/32/32"
                class="w-7 h-7 rounded-full ring-2 ring-white"
              />
              <img
                src="https://picsum.photos/id/202/32/32"
                class="w-7 h-7 rounded-full ring-2 ring-white"
              />
            </div>
            <p x-text="'⭐⭐⭐⭐⭐ ' + hero.rating + ' • ' + hero.ratingLabel"></p>
          </div>
          <div class="flex gap-4 text-xs">
            <template x-for="item in hero.trustItems" :key="item.icon">
              <span class="flex items-center gap-1">
                <i :class="'fas ' + item.icon"></i>
                <span x-text="item.text"></span>
              </span>
            </template>
          </div>
        </div>
        <!-- Right -->
        <div class="relative">
          <img
            :src="imgSrc(hero.imgId, 600, 680)"
            class="rounded-3xl shadow-2xl w-full object-cover h-80 md:h-[520px]"
            :alt="'Chị gái da sạch mịn sau trị mụn ' + brand"
          />
          <div
            class="absolute -bottom-6 -left-6 bg-white text-emerald-700 p-4 rounded-2xl shadow-xl"
          >
            <p class="font-bold" x-text="hero.beforeAfterLabel"></p>
            <img
              :src="imgSrc(hero.beforeAfterImgId, 280, 120)"
              class="rounded-xl mt-2 w-full h-20 object-cover"
            />
          </div>
          <div
            class="absolute top-6 right-6 bg-white text-zinc-800 px-4 py-2 rounded-2xl flex items-center gap-2 shadow"
          >
            <span class="text-emerald-500 text-3xl">✅</span>
            <div>
              <p class="font-semibold" x-text="hero.testimonialName"></p>
              <p class="text-xs" x-text="hero.testimonialResult"></p>
            </div>
          </div>
        </div>
      </div>
      <!-- Trust bar -->
      <div
        class="bg-white/10 backdrop-blur py-3 text-center text-xs flex flex-wrap justify-center gap-x-8 gap-y-2"
      >
        <template x-for="item in trustBar" :key="item">
          <span x-text="item"></span>
        </template>
      </div>
    </section>

    <!-- PAIN POINTS -->
    <section id="pain" class="section-padding bg-white">
      <div class="max-w-5xl mx-auto text-center">
        <p class="text-emerald-600 font-medium" x-text="pain.label"></p>
        <h2 class="text-3xl font-bold mt-2" x-text="pain.heading"></h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
          <template x-for="item in pain.items" :key="item.text">
            <div class="bg-zinc-100 p-5 rounded-2xl card-hover text-center">
              <div class="text-4xl mb-3" x-text="item.emoji"></div>
              <p class="font-semibold" x-text="item.text"></p>
            </div>
          </template>
        </div>
        <div class="mt-10 text-center">
          <button
            onclick="scrollToForm()"
            class="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-emerald-700 transition w-full sm:w-auto"
          x-text="pain.cta"></button>
        </div>
      </div>
    </section>

    <!-- SOLUTION -->
    <section id="solution" class="section-padding bg-emerald-50">
      <div class="max-w-7xl mx-auto px-4">
        <div class="text-center mb-10">
          <h2
            class="text-3xl font-bold"
            x-text="solution.heading"
          ></h2>
          <p class="mt-3 text-zinc-600" x-text="solution.subtitle"></p>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
          <template x-for="card in solution.cards" :key="card.title">
            <div class="bg-white rounded-3xl p-6 shadow relative">
              <div
                x-show="card.badge"
                class="absolute top-4 right-4 bg-rose-500 text-white text-xs px-3 py-1 rounded-full"
                x-text="card.badge"
              ></div>
              <img
                :src="imgSrc(card.imgId, 300, 200)"
                class="rounded-2xl w-full h-48 object-cover"
              />
              <h3 class="font-bold mt-4" x-text="card.title"></h3>
              <p x-show="card.desc" class="text-sm mt-2" x-text="card.desc"></p>
              <p x-show="card.price" class="text-emerald-600 font-semibold" x-text="card.price"></p>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- BENEFITS -->
    <section class="section-padding bg-white">
      <div class="max-w-5xl mx-auto px-4">
        <h2 class="text-center text-3xl font-bold mb-8" x-text="benefits.heading"></h2>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
          <template x-for="item in benefits.items" :key="item.title">
            <div class="flex gap-4">
              <span class="text-3xl" x-text="item.emoji"></span>
              <div>
                <p class="font-semibold" x-text="item.title"></p>
                <p x-show="item.sub" class="text-sm text-zinc-600" x-text="item.sub"></p>
              </div>
            </div>
          </template>
        </div>
        <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
          <button
            onclick="scrollToForm()"
            class="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-emerald-700 transition"
          >🚀 Đặt lịch tư vấn MIỄN PHÍ</button>
          <a
            x-bind:href="zalo"
            target="_blank"
            class="border-2 border-emerald-600 text-emerald-700 px-6 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 hover:bg-emerald-50 transition"
          ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460.1 436.6" class="w-5 h-5"><path fill="currentColor" d="M82.6 380.9c-1.8-.8-3.1-1.7-1-3.5 1.3-1 2.7-1.9 4.1-2.8 13.1-8.5 25.4-17.8 33.5-31.5 6.8-11.4 5.7-18.1-2.8-26.5C69 269.2 48.2 212.5 58.6 145.5 64.5 107.7 81.8 75 107 46.6c15.2-17.2 33.3-31.1 53.1-42.7 1.2-.7 2.9-.9 3.1-2.7-.4-1-1.1-.7-1.7-.7-33.7 0-67.4-.7-101 .2C28.3 1.7.5 26.6.6 62.3c.2 104.3 0 208.6 0 313 0 32.4 24.7 59.5 57 60.7 27.3 1.1 54.6.2 82 .1 2 .1 4 .2 6 .2H290c36 0 72 .2 108 0 33.4 0 60.5-27 60.5-60.3v-.6-58.5c0-1.4.5-2.9-.4-4.4-1.8.1-2.5 1.6-3.5 2.6-19.4 19.5-42.3 35.2-67.4 46.3-61.5 27.1-124.1 29-187.6 7.2-5.5-2-11.5-2.2-17.2-.8-8.4 2.1-16.7 4.6-25 7.1-24.4 7.6-49.3 11-74.8 6zm72.5-168.5c1.7-2.2 2.6-3.5 3.6-4.8 13.1-16.6 26.2-33.2 39.3-49.9 3.8-4.8 7.6-9.7 10-15.5 2.8-6.6-.2-12.8-7-15.2-3-.9-6.2-1.3-9.4-1.1-17.8-.1-35.7-.1-53.5 0-2.5 0-5 .3-7.4.9-5.6 1.4-9 7.1-7.6 12.8 1 3.8 4 6.8 7.8 7.7 2.4.6 4.9.9 7.4.8 10.8.1 21.7 0 32.5.1 1.2 0 2.7-.8 3.6 1-.9 1.2-1.8 2.4-2.7 3.5-15.5 19.6-30.9 39.3-46.4 58.9-3.8 4.9-5.8 10.3-3 16.3s8.5 7.1 14.3 7.5c4.6.3 9.3.1 14 .1 16.2 0 32.3.1 48.5-.1 8.6-.1 13.2-5.3 12.3-13.3-.7-6.3-5-9.6-13-9.7-14.1-.1-28.2 0-43.3 0zm116-52.6c-12.5-10.9-26.3-11.6-39.8-3.6-16.4 9.6-22.4 25.3-20.4 43.5 1.9 17 9.3 30.9 27.1 36.6 11.1 3.6 21.4 2.3 30.5-5.1 2.4-1.9 3.1-1.5 4.8.6 3.3 4.2 9 5.8 14 3.9 5-1.5 8.3-6.1 8.3-11.3.1-20 .2-40 0-60-.1-8-7.6-13.1-15.4-11.5-4.3.9-6.7 3.8-9.1 6.9zm69.3 37.1c-.4 25 20.3 43.9 46.3 41.3 23.9-2.4 39.4-20.3 38.6-45.6-.8-25-19.4-42.1-44.9-41.3-23.9.7-40.8 19.9-40 45.6zm-8.8-19.9c0-15.7.1-31.3 0-47 0-8-5.1-13-12.7-12.9-7.4.1-12.3 5.1-12.4 12.8-.1 4.7 0 9.3 0 14v79.5c0 6.2 3.8 11.6 8.8 12.9 6.9 1.9 14-2.2 15.8-9.1.3-1.2.5-2.4.4-3.7.2-15.5.1-31 .1-46.5z"/></svg> Nhắn Zalo</a>
          <a
            x-bind:href="messenger"
            target="_blank"
            class="bg-blue-600 text-white px-6 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition"
          ><i class="fab fa-facebook-messenger text-xl"></i> Messenger</a>
        </div>
      </div>
    </section>

    <!-- SOCIAL PROOF -->
    <section id="review" class="section-padding bg-zinc-100">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-center text-3xl font-bold mb-8" x-text="reviewsSection.heading"></h2>
        <div class="grid md:grid-cols-3 gap-6">
          <template x-for="item in [reviewsSection.items[0], reviewsSection.items[1], reviewsSection.items[2]]" :key="item.author">
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm">
              <div class="grid grid-cols-2 gap-0.5">
                <div class="relative">
                  <img :src="imgSrc(item.imgId, 300, 360)" class="w-full aspect-[5/6] object-cover" />
                  <span class="absolute bottom-2 left-2 bg-black/50 text-white text-xs px-2 py-0.5 rounded-full">Trước</span>
                </div>
                <div class="relative">
                  <img :src="imgSrc(item.afterImgId, 300, 360)" class="w-full aspect-[5/6] object-cover" />
                  <span class="absolute bottom-2 right-2 bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full">Sau ✨</span>
                </div>
              </div>
              <div class="p-4">
                <div class="text-sm mb-1">⭐⭐⭐⭐⭐</div>
                <p class="text-sm text-zinc-700 leading-snug" x-text="'&quot;' + item.quote + '&quot;'"></p>
                <p class="text-xs mt-2 text-zinc-400 font-medium" x-text="'— ' + item.author"></p>
              </div>
            </div>
          </template>
        </div>
        <p
          class="text-center mt-8 text-emerald-600 font-medium"
          x-text="reviewsSection.moreText.replace('{n}', reviews)"
        ></p>
      </div>
    </section>

    <!-- PROCESS -->
    <section id="process" class="section-padding bg-white">
      <div class="max-w-5xl mx-auto px-4">
        <h2 class="text-3xl font-bold text-center" x-text="process.heading"></h2>
        <div class="mt-10 flex flex-wrap justify-center items-start gap-y-10 text-center">
          <template x-for="(step, i) in process.steps" :key="i">
            <div class="flex items-start">
              <template x-if="i > 0">
                <div class="hidden md:flex items-center self-start pt-5 px-1 text-4xl text-emerald-300">→</div>
              </template>
              <div class="w-36 sm:w-44">
                <div
                  class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl font-bold shadow-md"
                  :class="i === process.steps.length - 1 ? 'bg-emerald-500 text-white' : 'bg-emerald-100 text-emerald-700'"
                  x-text="i + 1"
                ></div>
                <p class="font-semibold mt-4 text-base leading-snug px-2" x-text="step"></p>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- OFFER -->
    <section
      class="py-8 bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-center"
    >
      <div class="max-w-xl mx-auto px-4">
        <p class="uppercase tracking-widest text-emerald-200" x-text="offer.label"></p>
        <h2 class="text-4xl font-bold mt-2" x-text="offer.heading"></h2>
        <button
          onclick="scrollToForm()"
          class="mt-6 bg-white text-emerald-700 px-10 py-4 text-xl font-bold rounded-3xl shadow-xl hover:bg-amber-300 transition"
          x-text="offer.cta"
        ></button>
      </div>
    </section>

    <!-- FORM -->
    <section id="form" class="section-padding bg-zinc-900 text-white">
      <div class="max-w-2xl mx-auto px-4">
        <div class="bg-white text-zinc-800 rounded-3xl p-8 shadow-2xl">
          <h2 class="text-3xl font-bold text-center" x-text="form.heading"></h2>
          <p class="text-center text-zinc-500 mt-2" x-text="form.subtitle"></p>

          <form
            id="leadForm"
            class="mt-8 space-y-5"
            onsubmit="handleSubmit(event)"
          >
            <div>
              <input
                type="text"
                id="name"
                :placeholder="form.placeholderName"
                class="w-full border rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500"
                required
              />
            </div>
            <div>
              <input
                type="tel"
                id="phone"
                :placeholder="form.placeholderPhone"
                class="w-full border rounded-2xl px-5 py-3 focus:outline-none focus:border-emerald-500"
                required
              />
            </div>
            <textarea
              id="problem"
              rows="3"
              :placeholder="form.placeholderProblem"
              class="w-full border rounded-2xl px-5 py-3"
            ></textarea>

            <button
              type="submit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-5 rounded-3xl font-bold text-lg shadow"
              x-text="form.submitBtn"
            ></button>
          </form>

          <div class="flex justify-center gap-8 mt-6 text-xs">
            <div class="flex items-center gap-1">
              <i class="fas fa-lock"></i>
              <span x-text="form.privacyNote"></span>
            </div>
            <div>📍 <span x-text="form.branches"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section-padding bg-white">
      <div class="max-w-3xl mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8" x-text="faq.heading"></h2>
        <div class="space-y-4">
          <template x-for="item in faq.items" :key="item.q">
            <div class="border rounded-2xl overflow-hidden">
              <button
                onclick="toggleFAQ(this)"
                class="w-full px-5 py-4 text-left font-medium flex justify-between"
              >
                <span x-text="item.q"></span>
                <span class="faq-icon">↓</span>
              </button>
              <div class="accordion-content px-5 pb-4 text-zinc-600" x-text="item.a"></div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-zinc-900 text-white py-12">
      <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-8">
        <div>
          <div class="flex items-center gap-3 text-white">
            <span class="text-3xl">🌿</span>
            <span class="font-bold text-2xl" x-text="brand"></span>
          </div>
          <p class="mt-3 text-zinc-400" x-text="footer.tagline"></p>
          <div class="mt-4 flex gap-4 items-center">
            <a x-bind:href="zalo" target="_blank" title="Zalo">
              <svg width="30" height="30" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="8" fill="#0068FF"/><text x="20" y="28" font-size="23" font-weight="900" text-anchor="middle" fill="white" font-family="Arial,sans-serif">Z</text></svg>
            </a>
            <a x-bind:href="messenger" target="_blank" title="Messenger" class="text-[#0099FF] text-3xl leading-none">
              <i class="fab fa-facebook-messenger"></i>
            </a>
          </div>
          <p class="text-xs mt-8">
            Hotline:
            <a
              x-bind:href="'tel:' + phone.replace(/\s/g,'')"
              class="underline"
              x-text="phone"
            ></a>
          </p>
        </div>
        <div class="text-sm space-y-2">

    <script>
      function scrollToForm() {
        document.getElementById("form").scrollIntoView({ behavior: "smooth" });
      }

      function sendTelegram(data) {
        if (!CLIENT_CONFIG.telegramToken || !CLIENT_CONFIG.telegramChatId) return;
        const lines = [
          `🔔 <b>Đăng ký tư vấn mới!</b>`,
          `👤 <b>Tên:</b> ${data.name}`,
          `📞 <b>SĐT:</b> ${data.phone}`,
          data.email   ? `📧 <b>Email:</b> ${data.email}`   : null,
          data.problem ? `💬 <b>Vấn đề:</b> ${data.problem}` : null,
          `⏰ ${data.timestamp}`,
          `🌐 ${data.source}`,
        ].filter(Boolean).join("\n");
        fetch(`https://api.telegram.org/bot${CLIENT_CONFIG.telegramToken}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CLIENT_CONFIG.telegramChatId, text: lines, parse_mode: "HTML" }),
        }).catch(() => {});
      }

      function handleSubmit(e) {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();

        if (name.length < 3) { alert(CLIENT.alerts.nameError); return; }
        if (phone.length < 9) { alert(CLIENT.alerts.phoneError); return; }

        const btn = e.target.querySelector("[type=submit]");
        const originalText = btn.textContent;
        btn.textContent = "Đang gửi...";
        btn.disabled = true;

        const payload = new URLSearchParams({
          name,
          phone,
          problem: document.getElementById("problem").value.trim(),
          source:  window.location.href,
          timestamp: new Date().toLocaleString("vi-VN"),
          sheetId: CLIENT.sheetId || "",
        });

        const finish = () => {
          btn.textContent = originalText;
          btn.disabled = false;
          alert(CLIENT.alerts.successMsg);
          e.target.reset();
        };

        sendTelegram({ name, phone, problem: document.getElementById("problem").value.trim(), source: window.location.href, timestamp: new Date().toLocaleString("vi-VN") });

        if (CLIENT_CONFIG.scriptUrl && CLIENT.sheetId) {
          fetch(CLIENT_CONFIG.scriptUrl, { method: "POST", mode: "no-cors", body: payload })
            .then(finish)
            .catch(finish);
        } else {
          finish();
        }
      }

      function toggleFAQ(btn) {
        const content = btn.nextElementSibling;
        const icon = btn.querySelector(".faq-icon");

        if (content.style.maxHeight && content.style.maxHeight !== "0px") {
          content.style.maxHeight = "0px";
          icon.textContent = "↓";
        } else {
          document
            .querySelectorAll(".accordion-content")
            .forEach((c) => (c.style.maxHeight = "0px"));
          document
            .querySelectorAll(".faq-icon")
            .forEach((i) => (i.textContent = "↓"));

          content.style.maxHeight = content.scrollHeight + "px";
          icon.textContent = "↑";
        }
      }

      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          document.querySelectorAll("img").forEach((img) => {
            if (img.dataset.src) img.src = img.dataset.src;
          });
        }
      });

      document
        .getElementById("leadForm")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") handleSubmit(e);
        });

      let _popupClosed = false;

      function closePopup() {
        document.getElementById("popup-overlay").classList.add("hidden");
        _popupClosed = true;
      }

      function closePopupOutside(e) {
        if (e.target === document.getElementById("popup-overlay")) closePopup();
      }

      function handlePopupSubmit(e) {
        e.preventDefault();
        const name = document.getElementById("popup-name").value.trim();
        const phone = document.getElementById("popup-phone").value.trim();
        if (name.length < 3) { alert(CLIENT.alerts.nameError); return; }
        if (phone.length < 9) { alert(CLIENT.alerts.phoneError); return; }
        const btn = e.target.querySelector("[type=submit]");
        const orig = btn.textContent;
        btn.textContent = "Đang gửi...";
        btn.disabled = true;
        const payload = new URLSearchParams({
          name, phone,
          source: window.location.href,
          timestamp: new Date().toLocaleString("vi-VN"),
          sheetId: CLIENT.sheetId || "",
        });
        const finish = () => {
          btn.textContent = orig;
          btn.disabled = false;
          closePopup();
          alert(CLIENT.alerts.successMsg);
        };
        sendTelegram({ name, phone, source: window.location.href, timestamp: new Date().toLocaleString("vi-VN") });

        if (CLIENT_CONFIG.scriptUrl && CLIENT.sheetId) {
          fetch(CLIENT_CONFIG.scriptUrl, { method: "POST", mode: "no-cors", body: payload })
            .then(finish).catch(finish);
        } else {
          finish();
        }
      }

      window.addEventListener("scroll", function onFirstScroll() {
        window.removeEventListener("scroll", onFirstScroll);
        setTimeout(() => {
          if (!_popupClosed) {
            document.getElementById("popup-overlay").classList.remove("hidden");
          }
        }, 5000);
      }, { passive: true });
    </script>
